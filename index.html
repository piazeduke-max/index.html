<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мангал с шашлыком</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
            overflow: hidden;
        }
        canvas {
            border: 3px solid #333;
            border-radius: 12px;
            background: #87CEEB;
            width: auto;
            height: 96vh;
            aspect-ratio: 400 / 700;
        }
    </style>
</head>
<body>

    <canvas id="game" width="400" height="700"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const W = 400;
        const H = 700;
        const GROUND = 580;

        let time = 0;

        function draw() {
            time += 0.03;
            ctx.clearRect(0, 0, W, H);

            // ========== НЕБО ==========
            let g = ctx.createLinearGradient(0, 0, 0, GROUND);
            g.addColorStop(0, '#4A90D9');
            g.addColorStop(0.5, '#87CEEB');
            g.addColorStop(1, '#B5E8F7');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, GROUND);

            // ========== СОЛНЦЕ ==========
            ctx.shadowColor = '#FFE066';
            ctx.shadowBlur = 60;
            ctx.beginPath();
            ctx.arc(340, 70, 35, 0, Math.PI * 2);
            ctx.fillStyle = '#FFF9E6';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(332, 60, 8, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();

            // ========== ОБЛАКА ==========
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            drawCloud(60, 80, 40);
            drawCloud(200, 55, 35);
            drawCloud(320, 100, 38);
            drawCloud(30, 140, 25);
            drawCloud(360, 50, 28);

            // ========== ЗЕМЛЯ ==========
            let g2 = ctx.createLinearGradient(0, GROUND, 0, H);
            g2.addColorStop(0, '#66BB6A');
            g2.addColorStop(0.3, '#4CAF50');
            g2.addColorStop(0.7, '#388E3C');
            g2.addColorStop(1, '#1B5E20');
            ctx.fillStyle = g2;
            ctx.fillRect(0, GROUND, W, H - GROUND);

            // ========== ТРАВА ==========
            ctx.strokeStyle = '#388E3C';
            ctx.lineWidth = 2;
            for (let i = 0; i < W; i += 6) {
                let h = 5 + Math.sin(i * 0.2 + 0.5) * 4;
                ctx.beginPath();
                ctx.moveTo(i, GROUND);
                ctx.lineTo(i + 1.5, GROUND - h);
                ctx.stroke();
            }
            ctx.strokeStyle = '#2E7D32';
            ctx.lineWidth = 1.5;
            for (let i = 3; i < W; i += 8) {
                let h = 3 + Math.sin(i * 0.25 + 2.0) * 3;
                ctx.beginPath();
                ctx.moveTo(i, GROUND);
                ctx.lineTo(i + 1, GROUND - h);
                ctx.stroke();
            }

            // ========== МАНГАЛ ==========
            const mx = W / 2;
            const my = GROUND - 20;
            const scale = 1.6;

            // ---- НОЖКИ ----
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#3A3A3A';
            ctx.fillRect(mx - 110 * scale, my + 8 * scale, 12 * scale, 50 * scale);
            ctx.fillRect(mx + 98 * scale, my + 8 * scale, 12 * scale, 50 * scale);
            ctx.fillStyle = '#2A2A2A';
            ctx.fillRect(mx - 90 * scale, my + 12 * scale, 10 * scale, 40 * scale);
            ctx.fillRect(mx + 80 * scale, my + 12 * scale, 10 * scale, 40 * scale);

            // ---- КОРПУС ----
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 5;
            ctx.fillStyle = '#4A4A4A';
            ctx.beginPath();
            ctx.roundRect(mx - 120 * scale, my - 6 * scale, 240 * scale, 28 * scale, 6 * scale);
            ctx.fill();

            // ---- БОРТИК ПЕРЕДНИЙ ----
            ctx.shadowBlur = 0;
            let gradBorder = ctx.createLinearGradient(0, my - 30 * scale, 0, my);
            gradBorder.addColorStop(0, '#6A6A6A');
            gradBorder.addColorStop(0.5, '#5A5A5A');
            gradBorder.addColorStop(1, '#4A4A4A');
            ctx.fillStyle = gradBorder;
            ctx.beginPath();
            ctx.roundRect(mx - 120 * scale, my - 30 * scale, 240 * scale, 28 * scale, 6 * scale);
            ctx.fill();

            // ---- БОРТИК ЗАДНИЙ ----
            ctx.fillStyle = '#3A3A3A';
            ctx.beginPath();
            ctx.roundRect(mx - 112 * scale, my - 38 * scale, 224 * scale, 14 * scale, 4 * scale);
            ctx.fill();

            // ========== УГЛИ (ВНУТРИ) ==========
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1A0505';
            ctx.beginPath();
            ctx.ellipse(mx, my + 2 * scale, 100 * scale, 22 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            // ---- УГЛИ (ДЕТАЛИ) ----
            for (let i = 0; i < 50; i++) {
                let x = mx - 85 * scale + Math.random() * 170 * scale;
                let y = my - 6 * scale + Math.random() * 22 * scale;
                let r = 3 * scale + Math.random() * 7 * scale;
                let red = 30 + Math.random() * 80;
                let green = 5 + Math.random() * 15;
                ctx.fillStyle = `rgb(${red}, ${green}, 0)`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // ========== ОГОНЬ ВНУТРИ МАНГАЛА (ЯЗЫКИ ПЛАМЕНИ) ==========

            // ---- СВЕЧЕНИЕ ----
            let glowGrad = ctx.createRadialGradient(mx, my - 10 * scale, 10 * scale, mx, my - 10 * scale, 120 * scale);
            glowGrad.addColorStop(0, `rgba(255, 180, 50, ${0.15 + Math.sin(time * 0.5) * 0.05})`);
            glowGrad.addColorStop(0.4, `rgba(255, 120, 30, ${0.08 + Math.sin(time * 0.3 + 0.5) * 0.03})`);
            glowGrad.addColorStop(0.7, `rgba(200, 80, 20, ${0.04 + Math.sin(time * 0.2 + 1) * 0.02})`);
            glowGrad.addColorStop(1, 'rgba(100, 30, 0, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(mx, my - 10 * scale, 120 * scale, 0, Math.PI * 2);
            ctx.fill();

            // ---- РИСУЕМ ЯЗЫКИ ПЛАМЕНИ (похоже на настоящий огонь) ----
            for (let i = 0; i < 10; i++) {
                let x = mx - 50 * scale + i * 11 * scale + Math.sin(i * 0.5 + time * 0.8) * 6 * scale;
                let y = my - 4 * scale - Math.sin(i * 0.4 + time * 0.9) * 8 * scale;

                // Размер пламени
                let height = (25 + Math.sin(i * 0.7 + time * 1.1) * 12 + Math.sin(i * 1.5 + time * 0.6) * 6) * scale;
                let width = (8 + Math.sin(i * 0.5 + time * 0.7) * 3 + Math.sin(i * 1.3 + time * 0.4) * 2) * scale;

                // ВНЕШНИЙ СЛОЙ (тёмно-красный)
                ctx.shadowBlur = 0;
                ctx.fillStyle = `rgba(200, 30, 0, ${0.2 + Math.sin(time * 0.5 + i) * 0.05})`;
                drawFlameShape(x, y - height * 0.15, width * 1.1, height * 0.8);

                // СРЕДНИЙ СЛОЙ (оранжевый)
                ctx.fillStyle = `rgba(255, 120, 20, ${0.3 + Math.sin(time * 0.7 + i * 0.5) * 0.1})`;
                drawFlameShape(x, y - height * 0.25, width * 0.85, height * 0.75);

                // ВНУТРЕННИЙ СЛОЙ (жёлтый)
                ctx.fillStyle = `rgba(255, 200, 50, ${0.4 + Math.sin(time * 0.9 + i * 0.3) * 0.12})`;
                drawFlameShape(x, y - height * 0.35, width * 0.6, height * 0.65);

                // ЯДРО (бело-жёлтое)
                ctx.fillStyle = `rgba(255, 255, 200, ${0.5 + Math.sin(time * 1.2 + i * 0.2) * 0.15})`;
                drawFlameShape(x, y - height * 0.45, width * 0.35, height * 0.5);

                // ВЕРХУШКА (яркий язычок)
                ctx.fillStyle = `rgba(255, 255, 220, ${0.3 + Math.sin(time * 1.5 + i * 0.7) * 0.1})`;
                drawFlameTip(x, y - height * 0.7, width * 0.2, height * 0.35);
            }

            // ---- БОЛЬШИЕ ЯЗЫКИ ПЛАМЕНИ (по краям) ----
            for (let i = 0; i < 4; i++) {
                let x = mx - 40 * scale + i * 26 * scale + Math.sin(i * 0.8 + time * 0.6) * 4 * scale;
                let y = my - 6 * scale - Math.sin(i * 0.6 + time * 0.7) * 6 * scale;
                let height = (30 + Math.sin(i * 0.5 + time * 0.9) * 10) * scale;
                let width = (10 + Math.sin(i * 0.4 + time * 0.5) * 3) * scale;

                ctx.fillStyle = `rgba(255, 150, 30, ${0.15 + Math.sin(time * 0.6 + i * 0.4) * 0.05})`;
                drawFlameShape(x, y - height * 0.15, width * 1.0, height * 0.7);

                ctx.fillStyle = `rgba(255, 220, 80, ${0.2 + Math.sin(time * 0.8 + i * 0.3) * 0.08})`;
                drawFlameShape(x, y - height * 0.3, width * 0.7, height * 0.6);

                ctx.fillStyle = `rgba(255, 255, 200, ${0.25 + Math.sin(time * 1.0 + i * 0.2) * 0.1})`;
                drawFlameTip(x, y - height * 0.55, width * 0.3, height * 0.4);
            }

            // ---- ИСКРЫ ----
            ctx.shadowBlur = 0;
            for (let i = 0; i < 30; i++) {
                let x = mx - 65 * scale + Math.random() * 130 * scale;
                let y = my - 10 * scale - Math.random() * 40 * scale;
                let r = 1.5 * scale + Math.random() * 4 * scale;
                let alpha = 0.2 + Math.random() * 0.6;
                let flicker = Math.sin(time * 2.5 + i * 2.1) * 0.3 + 0.7;
                let color = Math.random() > 0.5 ? '255, 220, 100' : '255, 180, 50';
                ctx.fillStyle = `rgba(${color}, ${alpha * flicker})`;
                ctx.shadowColor = `rgba(255, 200, 50, ${alpha * 0.15 * flicker})`;
                ctx.shadowBlur = 12 * scale;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;

            // ========== ШАШЛЫКИ ==========
            drawShashlik(mx - 50 * scale, my - 90 * scale, 0, scale);
            drawShashlik(mx + 10 * scale, my - 100 * scale, 1, scale);
            drawShashlik(mx + 70 * scale, my - 90 * scale, 2, scale);

            // ========== ДЫМ ==========
            ctx.shadowBlur = 0;
            for (let i = 0; i < 20; i++) {
                let x = mx - 40 * scale + Math.sin(i * 0.6 + time * 0.8) * 60 * scale + Math.sin(i * 1.0 + time * 0.5) * 30 *
                scale;
                let y = my - 110 * scale - i * 20 * scale - Math.sin(time + i * 0.4) * 12 * scale;
                let r = 15 * scale + i * 4 * scale + Math.sin(time + i) * 6 * scale;
                let alpha = 0.15 - i * 0.007;
                if (alpha < 0) alpha = 0;
                ctx.fillStyle = `rgba(220, 220, 220, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // ========== НАДПИСЬ ==========
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.font = '18px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('🍖 ШАШЛЫК 🍖', W / 2, H - 12);
        }

        // ========== ФУНКЦИЯ РИСОВАНИЯ ФОРМЫ ПЛАМЕНИ ==========
        function drawFlameShape(x, y, w, h) {
            ctx.beginPath();
            ctx.moveTo(x - w * 0.6, y + h * 0.4);
            ctx.quadraticCurveTo(x - w * 0.8, y + h * 0.1, x - w * 0.5, y - h * 0.1);
            ctx.quadraticCurveTo(x - w * 0.7, y - h * 0.3, x - w * 0.4, y - h * 0.5);
            ctx.quadraticCurveTo(x - w * 0.5, y - h * 0.7, x - w * 0.2, y - h * 0.8);
            ctx.quadraticCurveTo(x, y - h, x + w * 0.2, y - h * 0.8);
            ctx.quadraticCurveTo(x + w * 0.5, y - h * 0.7, x + w * 0.4, y - h * 0.5);
            ctx.quadraticCurveTo(x + w * 0.7, y - h * 0.3, x + w * 0.5, y - h * 0.1);
            ctx.quadraticCurveTo(x + w * 0.8, y + h * 0.1, x + w * 0.6, y + h * 0.4);
            ctx.closePath();
            ctx.fill();
        }

        // ========== ФУНКЦИЯ РИСОВАНИЯ ВЕРХУШКИ ПЛАМЕНИ ==========
        function drawFlameTip(x, y, w, h) {
            ctx.beginPath();
            ctx.moveTo(x - w * 0.7, y + h * 0.3);
            ctx.quadraticCurveTo(x - w * 0.9, y, x - w * 0.6, y - h * 0.2);
            ctx.quadraticCurveTo(x - w * 0.8, y - h * 0.5, x - w * 0.4, y - h * 0.7);
            ctx.quadraticCurveTo(x, y - h * 0.9, x + w * 0.4, y - h * 0.7);
            ctx.quadraticCurveTo(x + w * 0.8, y - h * 0.5, x + w * 0.6, y - h * 0.2);
            ctx.quadraticCurveTo(x + w * 0.9, y, x + w * 0.7, y + h * 0.3);
            ctx.closePath();
            ctx.fill();
        }

        // ========== ФУНКЦИЯ РИСОВАНИЯ ШАШЛЫКА ==========
        function drawShashlik(x, y, offset, scale) {
            ctx.shadowBlur = 0;

            ctx.strokeStyle = '#8B7355';
            ctx.lineWidth = 4 * scale;
            ctx.beginPath();
            ctx.moveTo(x - 8 * scale, y + 70 * scale);
            ctx.lineTo(x + 8 * scale, y - 15 * scale);
            ctx.stroke();

            ctx.fillStyle = '#A0826A';
            ctx.fillRect(x - 10 * scale, y + 62 * scale, 20 * scale, 12 * scale);
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(x - 8 * scale, y + 58 * scale, 16 * scale, 6 * scale);

            const meatColors = ['#8B3A1A', '#A0522D', '#7A2E0A', '#9B4A2A', '#6B2A0A', '#8B4A2A'];
            const yOffsets = [8, 18, 28, 38, 48, 58];

            for (let i = 0; i < yOffsets.length; i++) {
                let px = x + Math.sin(i * 1.0 + offset * 1.5) * 12 * scale;
                let py = y + yOffsets[i] * scale;
                let size = 10 * scale + Math.sin(i * 0.4 + offset) * 3 * scale;

                ctx.shadowColor = 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 6 * scale;
                ctx.shadowOffsetY = 3 * scale;

                let color = meatColors[i % meatColors.length];
                let grad = ctx.createRadialGradient(px - 3 * scale, py - 3 * scale, 3 * scale, px, py, size);
                grad.addColorStop(0, lightenColor(color, 40));
                grad.addColorStop(0.5, color);
                grad.addColorStop(1, darkenColor(color, 40));
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(px, py, size, size * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(40, 20, 5, 0.25)';
                ctx.lineWidth = 1.5 * scale;
                for (let j = 0; j < 3; j++) {
                    let angle = Math.random() * Math.PI * 2;
                    let dx = Math.cos(angle) * size * 0.6;
                    let dy = Math.sin(angle) * size * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(px + dx * 0.2, py + dy * 0.2);
                    ctx.lineTo(px + dx * 0.8, py + dy * 0.8);
                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(255,200,150,0.12)';
                ctx.beginPath();
                ctx.ellipse(px - 3 * scale, py - 4 * scale, size * 0.3, size * 0.2, -0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,220,180,0.08)';
                for (let j = 0; j < 2; j++) {
                    let fx = px + (Math.random() - 0.5) * size * 0.8;
                    let fy = py + (Math.random() - 0.5) * size * 0.6;
                    ctx.beginPath();
                    ctx.arc(fx, fy, 2 * scale + Math.random() * 3 * scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#A0826A';
            ctx.beginPath();
            ctx.moveTo(x + 6 * scale, y - 15 * scale);
            ctx.lineTo(x + 12 * scale, y - 22 * scale);
            ctx.lineTo(x + 2 * scale, y - 15 * scale);
            ctx.fill();
        }

        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========

        function drawCloud(x, y, s) {
            ctx.beginPath();
            ctx.arc(x, y, s * 0.6, 0, Math.PI * 2);
            ctx.arc(x + s * 0.6, y - s * 0.2, s * 0.5, 0, Math.PI * 2);
            ctx.arc(x + s * 1.2, y, s * 0.5, 0, Math.PI * 2);
            ctx.arc(x + s * 0.7, y + s * 0.2, s * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }

        function lightenColor(color, amount) {
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            r = Math.min(255, r + amount);
            g = Math.min(255, g + amount);
            b = Math.min(255, b + amount);
            return `rgb(${r},${g},${b})`;
        }

        function darkenColor(color, amount) {
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            r = Math.max(0, r - amount);
            g = Math.max(0, g - amount);
            b = Math.max(0, b - amount);
            return `rgb(${r},${g},${b})`;
        }

        // ========== ПОЛИФИЛ ДЛЯ ROUNDRECT ==========
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        // ========== ЗАПУСК ==========
        function loop() {
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        console.log('Мангал с шашлыком и настоящим огнём! 🍖🔥');
    </script>
</body>
</html>
