<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный мангал с огнем</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Контейнер мангала */
        .mangal-container {
            position: relative;
            width: 700px;
            height: 450px;
            background: linear-gradient(to bottom, #2b2b2b, #151515);
            border: 10px solid #3a3a3a;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 10px 20px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* Слой углей с текстурой */
        .coals-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 160px;
            background: 
                radial-gradient(circle at 20% 80%, #ff3300 0%, transparent 50%),
                radial-gradient(circle at 50% 60%, #ff6600 0%, transparent 60%),
                radial-gradient(circle at 80% 75%, #ff2200 0%, transparent 50%),
                radial-gradient(ellipse at center, #220500 0%, #050505 100%);
            box-shadow: inset 0 -30px 50px #ff1100;
            animation: coalsGlow 1.8s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes coalsGlow {
            0% { filter: brightness(0.8) drop-shadow(0 0 10px #ff3300); }
            100% { filter: brightness(1.3) drop-shadow(0 0 25px #ff6600); }
        }

        /* Холст для анимированного огня и искр */
        #fireCanvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 250px;
            z-index: 2;
            pointer-events: none;
        }

        /* Шампуры */
        .skewer-row {
            position: absolute;
            width: 110%;
            left: -5%;
            height: 45px;
            display: flex;
            align-items: center;
            cursor: grab;
            z-index: 3;
        }

        .skewer-row:active { cursor: grabbing; }

        .rod {
            position: absolute;
            width: 100%;
            height: 6px;
            background: linear-gradient(to bottom, #e0e0e0, #666);
            z-index: 2;
        }

        .handle {
            position: absolute;
            left: 0;
            width: 40px;
            height: 16px;
            background: #5c2c06;
            border-radius: 4px;
            z-index: 3;
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.4);
        }

        .meat-group {
            position: absolute;
            left: 60px;
            display: flex;
            gap: 10px;
            z-index: 1;
        }

        .meat {
            width: 50px;
            height: 42px;
            background: radial-gradient(circle at 30% 30%, #8b3a12, #2d1000);
            border-radius: 45% 55% 40% 50%;
            box-shadow: 0 5px 8px rgba(0,0,0,0.7), inset -4px -4px 8px rgba(0,0,0,0.8);
        }

        /* Позиции рядов */
        #row-1 { top: 70px; }
        #row-2 { top: 150px; }
        #row-3 { top: 230px; }
    </style>
</head>
<body>

    <div class="mangal-container">
        <!-- Тлеющие угли -->
        <div class="coals-layer"></div>

        <!-- Анимация огня -->
        <canvas id="fireCanvas"></canvas>

        <!-- Шампуры -->
        <div class="skewer-row" id="row-1">
            <div class="handle"></div>
            <div class="rod"></div>
            <div class="meat-group">
                <div class="meat"></div><div class="meat"></div><div class="meat"></div><div class="meat"></div><div class="meat"></div>
            </div>
        </div>

        <div class="skewer-row" id="row-2">
            <div class="handle"></div>
            <div class="rod"></div>
            <div class="meat-group">
                <div class="meat"></div><div class="meat"></div><div class="meat"></div><div class="meat"></div><div class="meat"></div>
            </div>
        </div>

        <div class="skewer-row" id="row-3">
            <div class="handle"></div>
            <div class="rod"></div>
            <div class="meat-group">
                <div class="meat"></div><div class="meat"></div><div class="meat"></div><div class="meat"></div><div class="meat"></div>
            </div>
        </div>
    </div>

    <script>
        // --- АНИМАЦИЯ ОГНЯ И ИСКР ---
        const canvas = document.getElementById('fireCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();

        const particles = [];
        const sparks = [];

        class FlameParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.speedY = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.size = Math.random() * 25 + 15;
                this.alpha = 1;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.size *= 0.96;
                this.alpha -= 0.02;
                if (this.alpha <= 0 || this.size <= 2) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                // Градиент от желтого к красному
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, 'rgba(255, 230, 0, 0.8)');
                grad.addColorStop(0.4, 'rgba(255, 90, 0, 0.6)');
                grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
                
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }
        }

        class Spark {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height - 20;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 3 + 1;
                this.alpha = 1;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.alpha -= 0.015;
                if (this.alpha <= 0) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        // Создаем языки пламени и искры
        for (let i = 0; i < 35; i++) particles.push(new FlameParticle());
        for (let i = 0; i < 20; i++) sparks.push(new Spark());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            sparks.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- ВРАЩЕНИЕ ШАМПУРОВ ---
        document.querySelectorAll('.skewer-row').forEach(row => {
            const meatGroup = row.querySelector('.meat-group');
            let isDragging = false;
            let startY = 0;
            let currentRotation = 0;

            const start = (clientY) => {
                isDragging = true;
                startY = clientY;
            };

            const move = (clientY) => {
                if (!isDragging) return;
                const deltaY = clientY - startY;
                currentRotation += deltaY * 1.5;
                meatGroup.style.transform = `rotateX(${currentRotation}deg) scaleY(${Math.cos(currentRotation * Math.PI / 180)})`;
                startY = clientY;
            };

            const stop = () => { isDragging = false; };

            row.addEventListener('mousedown', (e) => start(e.clientY));
            window.addEventListener('mousemove', (e) => move(e.clientY));
            window.addEventListener('mouseup', stop);

            row.addEventListener('touchstart', (e) => start(e.touches[0].clientY));
            window.addEventListener('touchmove', (e) => move(e.touches[0].clientY));
            window.addEventListener('touchend', stop);
        });
    </script>

</body>
</html>
