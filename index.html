<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мангал с шашлыком</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
            overflow: hidden;
        }
        canvas {
            border: 3px solid #333;
            border-radius: 12px;
            background: #87CEEB;
            width: auto;
            height: 96vh;
            aspect-ratio: 400 / 700;
        }
    </style>
</head>
<body>

    <canvas id="game" width="400" height="700"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const W = 400;
        const H = 700;
        const GROUND = 620;

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // ========== НЕБО ==========
            let g = ctx.createLinearGradient(0, 0, 0, GROUND);
            g.addColorStop(0, '#4A90D9');
            g.addColorStop(0.5, '#87CEEB');
            g.addColorStop(1, '#B5E8F7');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, GROUND);

            // ========== СОЛНЦЕ ==========
            ctx.shadowColor = '#FFE066';
            ctx.shadowBlur = 60;
            ctx.beginPath();
            ctx.arc(340, 70, 35, 0, Math.PI * 2);
            ctx.fillStyle = '#FFF9E6';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(332, 60, 8, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();

            // ========== ОБЛАКА ==========
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            drawCloud(60, 90, 45);
            drawCloud(200, 60, 40);
            drawCloud(320, 120, 42);
            drawCloud(30, 160, 28);
            drawCloud(360, 55, 30);

            // ========== ЗЕМЛЯ ==========
            let g2 = ctx.createLinearGradient(0, GROUND, 0, H);
            g2.addColorStop(0, '#66BB6A');
            g2.addColorStop(0.3, '#4CAF50');
            g2.addColorStop(0.7, '#388E3C');
            g2.addColorStop(1, '#1B5E20');
            ctx.fillStyle = g2;
            ctx.fillRect(0, GROUND, W, H - GROUND);

            // ========== ТРАВА ==========
            ctx.strokeStyle = '#388E3C';
            ctx.lineWidth = 2;
            for (let i = 0; i < W; i += 7) {
                let h = 4 + Math.sin(i * 0.18 + 0.5) * 3;
                ctx.beginPath();
                ctx.moveTo(i, GROUND);
                ctx.lineTo(i + 1.5, GROUND - h);
                ctx.stroke();
            }

            // ========== МАНГАЛ ==========
            const mx = W / 2;
            const my = GROUND - 10;

            // Ножки мангала
            ctx.fillStyle = '#4A4A4A';
            ctx.shadowBlur = 0;
            // Левая ножка
            ctx.fillRect(mx - 70, my + 5, 8, 30);
            // Правая ножка
            ctx.fillRect(mx + 62, my + 5, 8, 30);
            // Задняя левая ножка
            ctx.fillRect(mx - 55, my + 8, 6, 25);
            // Задняя правая ножка
            ctx.fillRect(mx + 49, my + 8, 6, 25);

            // Корпус мангала (основание)
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 4;
            ctx.fillStyle = '#3D3D3D';
            ctx.beginPath();
            ctx.roundRect(mx - 75, my - 5, 150, 18, 4);
            ctx.fill();

            // Бортик мангала (передний)
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#5A5A5A';
            ctx.beginPath();
            ctx.roundRect(mx - 75, my - 20, 150, 18, 4);
            ctx.fill();

            // Бортик мангала (задний)
            ctx.fillStyle = '#4A4A4A';
            ctx.beginPath();
            ctx.roundRect(mx - 70, my - 25, 140, 10, 3);
            ctx.fill();

            // Внутренняя часть (угли)
            ctx.shadowBlur = 0;
            let grad3 = ctx.createRadialGradient(mx, my + 2, 10, mx, my + 2, 60);
            grad3.addColorStop(0, '#FF4500');
            grad3.addColorStop(0.3, '#FF6B00');
            grad3.addColorStop(0.6, '#CC3300');
            grad3.addColorStop(0.8, '#8B0000');
            grad3.addColorStop(1, '#2A0000');
            ctx.fillStyle = grad3;
            ctx.beginPath();
            ctx.ellipse(mx, my + 2, 65, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            // Угли (детали)
            for (let i = 0; i < 20; i++) {
                let x = mx - 50 + Math.random() * 100;
                let y = my - 2 + Math.random() * 12;
                let r = 3 + Math.random() * 6;
                let alpha = 0.4 + Math.random() * 0.6;
                let red = 100 + Math.random() * 155;
                ctx.fillStyle = `rgba(${red}, ${30 + Math.random() * 40}, 0, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Огоньки
            for (let i = 0; i < 8; i++) {
                let x = mx - 40 + Math.random() * 80;
                let y = my - 5 - Math.random() * 15;
                let r = 1 + Math.random() * 4;
                let alpha = 0.3 + Math.random() * 0.6;
                ctx.fillStyle = `rgba(255, 200, 50, ${alpha})`;
                ctx.shadowColor = 'rgba(255, 200, 50, 0.3)';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // ========== ШАШЛЫКИ ==========

            // Шампур 1 (левый)
            drawShashlik(mx - 30, my - 65, 0);

            // Шампур 2 (центральный)
            drawShashlik(mx + 5, my - 70, 1);

            // Шампур 3 (правый)
            drawShashlik(mx + 40, my - 65, 2);

            // ========== ДЫМ ==========
            ctx.shadowBlur = 0;
            let time = Date.now() * 0.001;
            for (let i = 0; i < 12; i++) {
                let x = mx - 30 + Math.sin(i * 0.8 + time) * 40 + Math.sin(i * 1.2 + time * 0.7) * 20;
                let y = my - 80 - i * 15 - Math.sin(time + i * 0.5) * 8;
                let r = 10 + i * 3 + Math.sin(time + i) * 4;
                let alpha = 0.15 - i * 0.012;
                if (alpha < 0) alpha = 0;
                ctx.fillStyle = `rgba(200, 200, 200, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // ========== НАДПИСЬ ==========
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('🍖 ШАШЛЫК 🍖', W / 2, H - 15);
        }

        // ========== ФУНКЦИЯ РИСОВАНИЯ ШАШЛЫКА ==========
        function drawShashlik(x, y, offset) {
            ctx.shadowBlur = 0;

            // Шампур (палочка)
            ctx.strokeStyle = '#8B7355';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x - 5, y + 50);
            ctx.lineTo(x + 5, y - 10);
            ctx.stroke();

            // Ручка шампура
            ctx.fillStyle = '#A0826A';
            ctx.fillRect(x - 7, y + 45, 14, 8);
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(x - 5, y + 43, 10, 4);

            // Мясо (кусочки)
            const meatColors = ['#8B3A1A', '#A0522D', '#7A2E0A', '#9B4A2A', '#6B2A0A'];
            const positions = [0, 1, 2, 3, 4];
            const yOffsets = [5, 14, 23, 32, 41];

            for (let i = 0; i < positions.length; i++) {
                let px = x + Math.sin(i * 1.2 + offset * 2) * 8;
                let py = y + yOffsets[i];
                let size = 8 + Math.sin(i * 0.5 + offset) * 2;

                // Тень кусочка
                ctx.shadowColor = 'rgba(0,0,0,0.1)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetY = 2;

                // Мясо
                let color = meatColors[i % meatColors.length];
                let grad = ctx.createRadialGradient(px - 2, py - 2, 2, px, py, size);
                grad.addColorStop(0, lightenColor(color, 30));
                grad.addColorStop(0.5, color);
                grad.addColorStop(1, darkenColor(color, 30));
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(px, py, size, size * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Прожилки (детали мяса)
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(40, 20, 5, 0.2)';
                ctx.lineWidth = 1;
                for (let j = 0; j < 2; j++) {
                    let angle = Math.random() * Math.PI * 2;
                    let dx = Math.cos(angle) * size * 0.5;
                    let dy = Math.sin(angle) * size * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(px + dx * 0.3, py + dy * 0.3);
                    ctx.lineTo(px + dx * 0.8, py + dy * 0.8);
                    ctx.stroke();
                }

                // Блик на мясе
                ctx.fillStyle = 'rgba(255,200,150,0.1)';
                ctx.beginPath();
                ctx.ellipse(px - 2, py - 3, size * 0.3, size * 0.2, -0.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Кончик шампура (остриё)
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#A0826A';
            ctx.beginPath();
            ctx.moveTo(x + 4, y - 10);
            ctx.lineTo(x + 8, y - 16);
            ctx.lineTo(x + 2, y - 10);
            ctx.fill();
        }

        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========

        function drawCloud(x, y, s) {
            ctx.beginPath();
            ctx.arc(x, y, s * 0.6, 0, Math.PI * 2);
            ctx.arc(x + s * 0.6, y - s * 0.2, s * 0.5, 0, Math.PI * 2);
            ctx.arc(x + s * 1.2, y, s * 0.5, 0, Math.PI * 2);
            ctx.arc(x + s * 0.7, y + s * 0.2, s * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }

        function lightenColor(color, amount) {
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            r = Math.min(255, r + amount);
            g = Math.min(255, g + amount);
            b = Math.min(255, b + amount);
            return `rgb(${r},${g},${b})`;
        }

        function darkenColor(color, amount) {
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            r = Math.max(0, r - amount);
            g = Math.max(0, g - amount);
            b = Math.max(0, b - amount);
            return `rgb(${r},${g},${b})`;
        }

        // ========== ПОЛИФИЛ ДЛЯ ROUNDRECT ==========
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        // ========== ЗАПУСК ==========
        function loop() {
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        console.log('Мангал с шашлыком! 🍖');
    </script>
</body>
</html>
