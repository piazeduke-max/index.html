<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вращение шампуров</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .bbq-stage {
            position: relative;
            width: 90vw;
            max-width: 900px;
            aspect-ratio: 16 / 9;
        }

        /* Фоновое фото */
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Зоны шампуров */
        .skewers-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .skewer-zone {
            position: absolute;
            height: 11%;
            width: 85%;
            left: 7%;
            cursor: grab;
            pointer-events: auto;
            border-radius: 20px;
        }

        .skewer-zone:active {
            cursor: grabbing;
        }

        /* Позиции под 5 шампуров с фото */
        #skewer-1 { top: 22%; transform: rotate(-10deg); }
        #skewer-2 { top: 35%; transform: rotate(-10deg); }
        #skewer-3 { top: 48%; transform: rotate(-10deg); }
        #skewer-4 { top: 61%; transform: rotate(-10deg); }
        #skewer-5 { top: 74%; transform: rotate(-10deg); }
    </style>
</head>
<body>

    <div class="bbq-stage">
        <!-- Поменяй 'shashlik.jpg' на имя твоего файла с картинкой -->
        <img src="shashlik.jpg" alt="Мангал" class="bg-image">

        <div class="skewers-layer">
            <div class="skewer-zone" id="skewer-1"></div>
            <div class="skewer-zone" id="skewer-2"></div>
            <div class="skewer-zone" id="skewer-3"></div>
            <div class="skewer-zone" id="skewer-4"></div>
            <div class="skewer-zone" id="skewer-5"></div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.skewer-zone').forEach(skewer => {
            let isDragging = false;
            let startY = 0;
            let currentRotation = 0;

            const start = (clientY) => {
                isDragging = true;
                startY = clientY;
            };

            const move = (clientY) => {
                if (!isDragging) return;
                const deltaY = clientY - startY;
                currentRotation += deltaY * 1.5;
                
                // Вращение отдельного шампура по оси X (создает объемный эффект)
                const baseTransform = getComputedStyle(skewer).transform;
                skewer.style.transform = `rotate(-10deg) rotateX(${currentRotation}deg)`;
                startY = clientY;
            };

            const stop = () => { isDragging = false; };

            skewer.addEventListener('mousedown', (e) => start(e.clientY));
            window.addEventListener('mousemove', (e) => move(e.clientY));
            window.addEventListener('mouseup', stop);

            skewer.addEventListener('touchstart', (e) => start(e.touches[0].clientY));
            window.addEventListener('touchmove', (e) => move(e.touches[0].clientY));
            window.addEventListener('touchend', stop);
        });
    </script>

</body>
</html>
