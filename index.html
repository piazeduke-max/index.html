<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вращение отдельных шампуров</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Контейнер для наложения слоев */
        .bbq-container {
            position: relative;
            width: 800px;
            height: 500px;
        }

        /* Фоновый мангал */
        .mangal-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Отдельные шампуры */
        .shampur {
            position: absolute;
            cursor: grab;
            transition: transform 0.1s linear;
            user-select: none;
        }

        .shampur:active {
            cursor: grabbing;
        }

        /* Позиционирование каждого шампура (настраивается под твои картинки) */
        #skewer1 { top: 10%; left: 5%; width: 90%; }
        #skewer2 { top: 30%; left: 5%; width: 90%; }
        #skewer3 { top: 50%; left: 5%; width: 90%; }
    </style>
</head>
<body>

    <div class="bbq-container">
        <!-- Фон мангала без шампуров -->
        <img src="mangal_empty.png" class="mangal-bg" alt="Мангал">

        /* Вырезанные PNG-картинки отдельных шампуров */
        <img src="shampur1.png" class="shampur" id="skewer1" alt="Шампур 1">
        <img src="shampur2.png" class="shampur" id="skewer2" alt="Шампур 2">
        <img src="shampur3.png" class="shampur" id="skewer3" alt="Шампур 3">
    </div>

    <script>
        document.querySelectorAll('.shampur').forEach(skewer => {
            let isDragging = false;
            let startX = 0;
            let currentRotation = 0;

            const start = (clientX) => {
                isDragging = true;
                startX = clientX;
            };

            const move = (clientX) => {
                if (!isDragging) return;
                const deltaX = clientX - startX;
                currentRotation += deltaX * 0.8;
                // Вращение конкретного шампура вокруг своей оси
                skewer.style.transform = `rotate(${currentRotation}deg)`;
                startX = clientX;
            };

            const stop = () => { isDragging = false; };

            skewer.addEventListener('mousedown', (e) => start(e.clientX));
            window.addEventListener('mousemove', (e) => move(e.clientX));
            window.addEventListener('mouseup', stop);

            skewer.addEventListener('touchstart', (e) => start(e.touches[0].clientX));
            window.addEventListener('touchmove', (e) => move(e.touches[0].clientX));
            window.addEventListener('touchend', stop);
        });
    </script>

</body>
</html>
