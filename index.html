<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вращающийся шашлык</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none; /* Запрещает выделение текста/картинки */
        }

        .image-container {
            width: 95vw;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab; /* Курсор-рука */
        }

        .image-container:active {
            cursor: grabbing; /* Курсор при зажатии */
        }

        .rotatable-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.05s linear; /* Плавность вращения */
            pointer-events: none; /* Предотвращает стандартное перетаскивание браузером */
        }
    </style>
</head>
<body>

    <div class="image-container" id="container">
        <!-- Укажи имя своего файла с картинкой на GitHub -->
        <img src="shashlik.jpg" alt="Шашлык" class="rotatable-image" id="image">
    </div>

    <script>
        const container = document.getElementById('container');
        const image = document.getElementById('image');

        let isDragging = false;
        let startX = 0;
        let currentRotation = 0;

        // Начало нажатия мышью или пальцем
        const startDrag = (clientX) => {
            isDragging = true;
            startX = clientX;
        };

        // Движение мышью или пальцем
        const moveDrag = (clientX) => {
            if (!isDragging) return;
            const deltaX = clientX - startX;
            currentRotation += deltaX * 0.5; // Скорость вращения
            image.style.transform = `rotate(${currentRotation}deg)`;
            startX = clientX;
        };

        // Конец нажатия
        const stopDrag = () => {
            isDragging = false;
        };

        // События для мыши (ПК)
        container.addEventListener('mousedown', (e) => startDrag(e.clientX));
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
        window.addEventListener('mouseup', stopDrag);

        // События для сенсорных экранов (смартфоны, планшеты)
        container.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX));
        window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX));
        window.addEventListener('touchend', stopDrag);
    </script>

</body>
</html>
