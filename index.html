<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сочный шашлык</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-content {
            padding: 20px;
        }
        .card h2 {
            margin: 0 0 10px;
            color: #333;
        }
        .card p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Убедись, что имя файла картинки совпадает с src -->
        <img src="shashlik.jpg" alt="Сочный шашлык на мангале">
        <div class="card-content">
            <h2>Сочный шашлык на мангале</h2>
            <p>Аппетитные кусочки мяса, запеченные до золотистой корочки на углях.</p>
        </div>
    </div>

</body>
</html>
