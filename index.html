<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вращение каждого шампура</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
            user-select: none;
        }

        #bbqCanvas {
            max-width: 95vw;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            cursor: grab;
            display: none; /* Прячем пока не загрузится картинка */
        }

        #bbqCanvas:active { cursor: grabbing; }

        #loader { font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="loader">Загрузка мангала...</div>
    <canvas id="bbqCanvas"></canvas>

    <script>
        const canvas = document.getElementById('bbqCanvas');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('loader');
        const img = new Image();

        // Укажи точное имя файла с картинкой на GitHub (сохрани регистр букв!)
        img.src = 'shashlik.jpg'; 

        // Описание 5 шампуров (координаты y, высота, угол наклона)
        // Эти параметры подобраны под оригинальное фото
        let skewers = [
            { y: 135, height: 75, rotation: 0, angle: -10, id: 0 },
            { y: 228, height: 75, rotation: 0, angle: -10, id: 1 },
            { y: 317, height: 78, rotation: 0, angle: -10, id: 2 },
            { y: 407, height: 80, rotation: 0, angle: -10, id: 3 },
            { y: 497, height: 80, rotation: 0, angle: -10, id: 4 }
        ];

        let activeSkewer = null;
        let startY = 0;

        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            loader.style.display = 'none';
            canvas.style.display = 'block';
            drawScene();
        };

        // Основная функция отрисовки
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Рисуем оригинальное фото как фон
            ctx.drawImage(img, 0, 0);

            // 2. Рисуем поверх «крутящиеся» слои для каждого шампура
            skewers.forEach(skewer => {
                drawRotatedSkewer(skewer);
            });
        }

        function drawRotatedSkewer(skewer) {
            ctx.save();

            // Создаем маску для выделения области шампура
            ctx.beginPath();
            ctx.rect(0, skewer.y, canvas.width, skewer.height);
            ctx.clip();

            // Применяем 3D-вращение через деформацию по оси Y
            const scaleY = Math.abs(Math.cos(skewer.rotation)); 
            
            ctx.translate(canvas.width / 2, skewer.y + skewer.height / 2);
            ctx.scale(1, scaleY);
            
            // Убираем наклон фото для ровного вращения
            ctx.rotate(-skewer.angle * Math.PI / 180); 
            
            // Отрисовываем кусок фона в этой области
            ctx.drawImage(img, 
                0, skewer.y, canvas.width, skewer.height, 
                -canvas.width / 2, -skewer.height / 2, canvas.width, skewer.height
            );

            ctx.restore();
        }

        // --- Обработка событий ---

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function startDrag(e) {
            const pos = getMousePos(e);
            
            // Определяем, по какому шампуру кликнули
            activeSkewer = skewers.find(s => pos.y >= s.y && pos.y <= (s.y + s.height));
            if (activeSkewer) {
                startY = e.clientY;
            }
        }

        function moveDrag(e) {
            if (!activeSkewer) return;
            
            const deltaY = e.clientY - startY;
            
            // Вращаем (в радианах)
            activeSkewer.rotation += deltaY * 0.05; 
            
            startY = e.clientY;
            drawScene(); // Перерисовываем холст
        }

        function stopDrag() {
            activeSkewer = null;
        }

        // Мышь
        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', stopDrag);

        // Тач
        canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
        window.addEventListener('touchmove', (e) => moveDrag(e.touches[0]));
        window.addEventListener('touchend', stopDrag);

    </script>

</body>
</html>
