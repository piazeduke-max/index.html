<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный мангал</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Общий контейнер мангала */
        .mangal-container {
            position: relative;
            width: 600px;
            height: 400px;
            background: linear-gradient(to bottom, #2b2b2b, #1a1a1a);
            border: 8px solid #3c3c3c;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 10px 20px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* Тлеющие угли на дне */
        .coals {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: radial-gradient(ellipse at center, #ff4500 0%, #ff8c00 40%, #111 80%);
            box-shadow: inset 0 -20px 30px #ff0000;
            opacity: 0.85;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% { opacity: 0.7; filter: brightness(0.9); }
            100% { opacity: 1; filter: brightness(1.2); }
        }

        /* Шампур */
        .skewer-row {
            position: absolute;
            width: 110%;
            left: -5%;
            height: 40px;
            display: flex;
            align-items: center;
            cursor: grab;
            transform-origin: center;
        }

        .skewer-row:active {
            cursor: grabbing;
        }

        /* Металлический стержень */
        .rod {
            position: absolute;
            width: 100%;
            height: 6px;
            background: linear-gradient(to bottom, #ccc, #666);
            z-index: 2;
        }

        /* Ручка шампура */
        .handle {
            position: absolute;
            left: 0;
            width: 35px;
            height: 14px;
            background: #8B4513;
            border-radius: 4px;
            z-index: 3;
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.3);
        }

        /* Куски мяса на шампуре */
        .meat-group {
            position: absolute;
            left: 50px;
            display: flex;
            gap: 8px;
            z-index: 1;
            transition: transform 0.05s linear;
        }

        .meat {
            width: 45px;
            height: 38px;
            background: radial-gradient(circle at 30% 30%, #8B4513, #3d1c02);
            border-radius: 50% 40% 45% 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset -4px -4px 8px rgba(0,0,0,0.7);
        }

        /* Позиции рядов шампуров */
        #row-1 { top: 60px; }
        #row-2 { top: 130px; }
        #row-3 { top: 200px; }
    </style>
</head>
<body>

    <div class="mangal-container">
        <div class="coals"></div>

        <!-- Шампур 1 -->
        <div class="skewer-row" id="row-1">
            <div class="handle"></div>
            <div class="rod"></div>
            <div class="meat-group">
                <div class="meat"></div>
                <div class="meat"></div>
                <div class="meat"></div>
                <div class="meat"></div>
                <div class="meat"></div>
            </div>
        </div>

        <!-- Шампур 2 -->
        <div class="skewer-row" id="row-2">
            <div class="handle"></div>
            <div class="rod"></div>
            <div class="meat-group">
                <div class="meat"></div>
                <div class="meat"></div>
                <div class="meat"></div>
                <div class="meat"></div>
                <div class="meat"></div>
            </div>
        </div>

        <!-- Шампур 3 -->
        <div class="skewer-row" id="row-3">
            <div class="handle"></div>
            <div class="rod"></div>
            <div class="meat-group">
                <div class="meat"></div>
                <div class="meat"></div>
                <div class="meat"></div>
                <div class="meat"></div>
                <div class="meat"></div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.skewer-row').forEach(row => {
            const meatGroup = row.querySelector('.meat-group');
            let isDragging = false;
            let startY = 0;
            let currentRotation = 0;

            row.addEventListener('mousedown', (e) => {
                isDragging = true;
                startY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaY = e.clientY - startY;
                currentRotation += deltaY * 1.5;
                
                // Эффект вращения мяса вокруг оси шампура
                meatGroup.style.transform = `rotateX(${currentRotation}deg) scaleY(${Math.cos(currentRotation * Math.PI / 180)})`;
                startY = e.clientY;
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            // Поддержка сенсоров (смартфоны)
            row.addEventListener('touchstart', (e) => {
                isDragging = true;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const deltaY = e.touches[0].clientY - startY;
                currentRotation += deltaY * 1.5;
                meatGroup.style.transform = `rotateX(${currentRotation}deg) scaleY(${Math.cos(currentRotation * Math.PI / 180)})`;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchend', () => { isDragging = false; });
        });
    </script>

</body>
</html>
